# Build + push the ingest image to GHCR, tagged with the git SHA, and print its digest.
# Deploy is GitOps: copy the printed digest into bluesky-trends-deploy by hand (no Image
# Updater). The image's env-var contract is README.md "Deployment contract".
name: ingest-image

on:
  push:
    branches: [main]
    paths:
      - "ingest/**"
      - "schemas/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ingest-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ingest-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dedyoc/bluesky-trends-ingest

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Image:  ${IMAGE}:${GITHUB_SHA}"
          echo "Digest: ${IMAGE}@${DIGEST}"
          {
            echo "### ingest image"
            echo
            echo "Pin this in bluesky-trends-deploy:"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Tag: \`${IMAGE}:${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
